[package]
name = "axon_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
nix = { version = "0.29", features = ["mman", "event", "fs", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cdr-encoding = "0.10"
byteorder = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
once_cell = "1"
glob = "0.3"
zstd = { version = "0.13", default-features = false }
quick-xml = "0.36"
socket2 = { version = "0.6", features = ["all"] }

# QUIC transport dependencies
quinn = "0.11"
quinn-proto = "0.11"
rustls = "=0.23.40"
rustls-pki-types = "1"
rcgen = "0.13"
ring = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zeroize = "1"

[patch.crates-io]
rustls = { path = "../third_party/rustls-axon/rustls" }

[[bin]]
name = "axon_daemon"
path = "src/bin/axon_daemon.rs"
