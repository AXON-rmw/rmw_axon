name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: axon_core (Rust unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axon_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('axon_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked --manifest-path axon_core/Cargo.toml

      # Deterministic suites: unit tests plus the integration suites that do not
      # depend on bidirectional QUIC/UDP loopback timing.
      - name: Test (unit + SHM + daemon + remote + security)
        run: |
          cargo test --locked --manifest-path axon_core/Cargo.toml --lib --bins
          cargo test --locked --manifest-path axon_core/Cargo.toml \
            --test cross_process_shm \
            --test daemon_integration \
            --test remote_integration \
            --test qkd_quic_psk

      # The test binary skips only bidirectional QUIC service-call cases under
      # GitHub Actions. One-way send/receive and large-message QUIC coverage
      # still run and must pass.
      - name: Test QUIC integration
        timeout-minutes: 3
        run: cargo test --locked --manifest-path axon_core/Cargo.toml --test quic_integration
